title: Campaign Slideshows
icon: 📺
columns:
  - width: 1/1
    fields:
      defaults:
        label: Default Autodetect Slideshow
        type: select
        options: query
        query: page.children.filterBy('intendedTemplate', 'lst-slideshow')
        empty: No Slideshows created
      tags:
        label: Set Valid Campaign Categories
        type: tags
  - width: 2/3
    sections:
      slideshows:
        label: Slideshows
        type: pages
        template:
          - lst-slideshow
  - width: 1/3
    sections:
      slidegalleries:
        label: Shared Slide Images
        type: pages
        layout: cardlets
        template:
          - lst-gallery
        info: "{{ page.images.count }} image(s)"
        empty: No galleries created
        image:
          cover: true
          query: page.previewImage
      webslides:
        label: Web Slides
        type: pages
        parent: site.find("slideshows/web-slide")
        empty: No Web Slides
        template:
          - lst-web-goal
          - lst-web-goal2
          - lst-web-event
          - lst-web-error
