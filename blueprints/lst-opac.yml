title: OPAC Page
icon: 📚
columns:
  left:
    width: 2/3
    fields:
      htmltitle:
        label: Page Title
        type: text
      headline:
        label: Headline
        type: text
      links:
        label: OPAC Links
        type: structure
        fields:
          icon:
            label: icon
            type: text
          link:
            label: URL
            type: url
          description:
            label: Description
            type: text
  right:
    width: 1/3
    fields:
      ref:
        extends: fields/lst-links
        label: Refrence Links
      header_image:
        type: files
        query: page.images
        multiple: false
        label: Header Image
      sidebar:
        type: toggle
        text:
          - "Disabled"
          - "Enabled"
        label: Show Slideshow
      slideshow:
        label: Slideshow
        type: select
        options: query
        query: page('slideshows').children.filterBy('intendedTemplate', 'lst-slideshow')
        when: 
          sidebar: true