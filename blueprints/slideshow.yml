title: slideshow
icon: 📺
fields:
  delay:
    label: Delay Between Slides (Milliseconds)
    type: number
    min: 1000
  gallery:
    label: Image Gallery
    type: pages
    query: page.parent.children.filterBy('intendedTemplate', 'lst-gallery')
  tags:
    label: Campaign Categories
    type: multiselect
    accept: options
    options: query
    query: page.parent.tags.split(',')
